<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Dino Runner</title>

    <!-- CSS -->
    <style>
        body {
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 600px;
            height: 150px;
            border: 2px solid #333;
            background: #fff;
            overflow: hidden;
        }

        #dino {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 40px;
            height: 40px;
            background: #555;
            border-radius: 5px;
        }

        #obstacle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 40px;
            background: #b22222;
            border-radius: 3px;
        }

        #score {
            position: absolute;
            top: 5px;
            right: 10px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- Game Container -->
    <div id="game">
        <div id="dino"></div>
        <div id="obstacle"></div>
        <div id="score">Score: 0</div>
    </div>

    <!-- JavaScript -->
    <script>
        const dino = document.getElementById('dino');
        const obstacle = document.getElementById('obstacle');
        const scoreDisplay = document.getElementById('score');

        let isJumping = false;
        let position = 0;
        let obstacleSpeed = 5;
        let score = 0;

        // Jump function
        function jump() {
            if (isJumping) return;
            isJumping = true;

            let upInterval = setInterval(() => {
                if (position >= 100) {
                    clearInterval(upInterval);

                    let downInterval = setInterval(() => {
                        if (position <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        } else {
                            position -= 5;
                            dino.style.bottom = position + 'px';
                        }
                    }, 20);
                } else {
                    position += 5;
                    dino.style.bottom = position + 'px';
                }
            }, 20);
        }

        // Space key to jump
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                jump();
            }
        });

        // Move obstacle and check collision
        function moveObstacle() {
            let obstacleRight = parseInt(
                window.getComputedStyle(obstacle).getPropertyValue('right')
            );

            if (obstacleRight > 600) {
                obstacle.style.right = '-20px';
                obstacleSpeed += 0.1;
                score++;
                scoreDisplay.textContent = 'Score: ' + score;
            } else {
                obstacle.style.right = (obstacleRight + obstacleSpeed) + 'px';
            }

            // Collision detection
            let dinoLeft = 50;
            let dinoWidth = 40;
            let obstaclePos = 600 - obstacleRight;

            if (
                obstaclePos < dinoLeft + dinoWidth &&
                obstaclePos + 20 > dinoLeft &&
                position < 40
            ) {
                alert('Game Over! Your score: ' + score);

                // Reset game
                score = 0;
                obstacleSpeed = 5;
                scoreDisplay.textContent = 'Score: 0';
                obstacle.style.right = '0px';
                position = 0;
                dino.style.bottom = '0px';
            }
        }

        setInterval(moveObstacle, 20);
    </script>

</body>
</html>
